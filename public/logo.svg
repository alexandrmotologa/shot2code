<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Viewfinder capture corners -->
  <path d="M 28 44 L 28 32 A 4 4 0 0 1 32 28 L 44 28" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 84 28 L 96 28 A 4 4 0 0 1 100 32 L 100 44" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 28 84 L 28 96 A 4 4 0 0 0 32 100 L 44 100" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 84 100 L 96 100 A 4 4 0 0 0 100 96 L 100 84" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center camera lens / scanning pulse line -->
  <line x1="28" y1="64" x2="100" y2="64" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Code brackets & slash </> -->
  <!-- Left angle bracket < -->
  <path d="M 50 50 L 38 64 L 50 78" stroke="url(#grad-primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right angle bracket > -->
  <path d="M 78 50 L 90 64 L 78 78" stroke="url(#grad-primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Code Slash / -->
  <line x1="68" y1="46" x2="60" y2="82" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Focal capture dot -->
  <circle cx="64" cy="64" r="3" fill="#4ade80" filter="url(#glow)" />
</svg>
