<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Emerald Optics Gradient -->
    <linearGradient id="falcon-optics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Titanium Beak -->
    <linearGradient id="beak-culmen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#22c55e" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- ======================================================== -->
      <!-- 100% Watertight Solid Base Silhouette (Aerodynamic Falcon)-->
      <!-- ======================================================== -->
      <path d="
        M 0,-340
        L 90,-310 L 150,-240 L 175,-270 L 225,-180 L 255,-60 L 250,90 L 195,220 L 130,300 L 0,355
        L -130,300 L -195,220 L -250,90 L -255,-60 L -225,-180 L -175,-270 L -150,-240 L -90,-310
        Z
      " fill="#090d16" />

      <!-- ======================================================== -->
      <!-- Low-Poly Origami Facets — Peregrine Optical Falcon       -->
      <!-- ======================================================== -->

      <!-- Crown Crest (Sharp Aerodynamic Brow) -->
      <polygon points="0,-340 90,-310 0,-270" fill="#334155" />
      <polygon points="0,-340 -90,-310 0,-270" fill="#1e293b" />
      
      <polygon points="90,-310 150,-240 85,-220 0,-270" fill="#475569" />
      <polygon points="-90,-310 -150,-240 -85,-220 0,-270" fill="#1e293b" />

      <!-- Ear Tufts / Crest Fins -->
      <polygon points="150,-240 175,-270 225,-180 145,-170" fill="#334155" />
      <polygon points="-150,-240 -175,-270 -225,-180 -145,-170" fill="#0f172a" />

      <!-- Central Forehead -->
      <polygon points="0,-270 85,-220 0,-170" fill="#334155" />
      <polygon points="0,-270 -85,-220 0,-170" fill="#1e293b" />

      <!-- Supraorbital Brow Shields -->
      <polygon points="0,-170 85,-220 145,-170 55,-135" fill="#475569" />
      <polygon points="0,-170 -85,-220 -145,-170 -55,-135" fill="#0f172a" />

      <polygon points="55,-135 145,-170 180,-115 85,-105" fill="#64748b" />
      <polygon points="-55,-135 -145,-170 -180,-115 -85,-105" fill="#1e293b" />

      <!-- Temporal Cheeks Outer Facets -->
      <polygon points="225,-180 255,-60 190,-40 180,-115" fill="#1e293b" />
      <polygon points="-225,-180 -255,-60 -190,-40 -180,-115" fill="#0b0f19" />

      <!-- Falcon Malar Stripe (Obsidian Helmet) -->
      <polygon points="180,-115 190,-40 135,45 95,-25" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="-180,-115 -190,-40 -135,45 -95,-25" fill="#060910" stroke="#1e293b" stroke-width="1.5" />

      <polygon points="255,-60 250,90 185,130 135,45 190,-40" fill="#1e293b" />
      <polygon points="-255,-60 -250,90 -185,130 -135,45 -190,-40" fill="#0f172a" />

      <!-- Cere / Bridge of Beak (Cyan telemetry accent) -->
      <polygon points="0,-170 55,-135 0,-45" fill="#38bdf8" />
      <polygon points="0,-170 -55,-135 0,-45" fill="#0284c7" />

      <!-- Raptor Hooked Beak -->
      <polygon points="0,-45 45,-35 35,45 0,135" fill="url(#beak-culmen)" />
      <polygon points="0,-45 -45,-35 -35,45 0,135" fill="#475569" />
      <polygon points="0,45 35,45 0,135" fill="#94a3b8" />
      <polygon points="0,45 -35,45 0,135" fill="#334155" />
      <!-- Hooked Beak Tip -->
      <polygon points="0,105 12,125 0,145 -12,125" fill="#090d16" />

      <!-- Mouth Line -->
      <polygon points="35,45 95,-25 45,-35" fill="#1e293b" />
      <polygon points="-35,45 -95,-25 -45,-35" fill="#0f172a" />

      <!-- ======================================================== -->
      <!-- PREDATOR OPTICS (EMERALD-CYAN FALCON EYES)              -->
      <!-- ======================================================== -->
      <!-- Right Eye Socket -->
      <polygon points="85,-105 145,-130 160,-85 100,-75" fill="#050811" />
      <!-- Right Eye (Almond Cant) -->
      <polygon points="95,-100 140,-120 150,-90 105,-80" fill="url(#falcon-optics)" />
      <!-- Pupil Slit -->
      <polygon points="115,-105 128,-110 130,-95 120,-90" fill="#090d16" />
      <circle cx="122" cy="-101" r="2.5" fill="#ffffff" />

      <!-- Left Eye Socket -->
      <polygon points="-85,-105 -145,-130 -160,-85 -100,-75" fill="#020408" />
      <!-- Left Eye (Almond Cant) -->
      <polygon points="-95,-100 -140,-120 -150,-90 -105,-80" fill="url(#falcon-optics)" />
      <!-- Pupil Slit -->
      <polygon points="-115,-105 -128,-110 -130,-95 -120,-90" fill="#05070d" />
      <circle cx="-122" cy="-101" r="2.5" fill="#ffffff" />

      <!-- ======================================================== -->
      <!-- GORGET BREASTPLATE & CHEST SHIELD                       -->
      <!-- ======================================================== -->
      <!-- Throat facets -->
      <polygon points="0,135 55,145 0,225" fill="#334155" />
      <polygon points="0,135 -55,145 0,225" fill="#1e293b" />

      <polygon points="55,145 125,160 75,235 0,225" fill="#475569" />
      <polygon points="-55,145 -125,160 -75,235 0,225" fill="#0f172a" />

      <polygon points="125,160 185,130 165,225 75,235" fill="#1e293b" />
      <polygon points="-125,160 -185,130 -165,225 -75,235" fill="#0b0f19" />

      <!-- Flanks -->
      <polygon points="185,130 195,220 165,225" fill="#334155" />
      <polygon points="-185,130 -195,220 -165,225" fill="#0f172a" />

      <polygon points="195,220 130,300 105,275 165,225" fill="#1e293b" />
      <polygon points="-195,220 -130,300 -105,275 -165,225" fill="#0b0f19" />

      <!-- Center Gorget Keel -->
      <polygon points="0,225 75,235 0,335" fill="#334155" />
      <polygon points="0,225 -75,235 0,335" fill="#0f172a" />

      <polygon points="75,235 105,275 55,345 0,335" fill="#475569" />
      <polygon points="-75,235 -105,275 -55,345 0,335" fill="#1e293b" />

      <polygon points="105,275 130,300 55,345" fill="#1e293b" />
      <polygon points="-105,275 -130,300 -55,345" fill="#0f172a" />

      <!-- Keel Point Sensor Diamond -->
      <polygon points="0,265 24,295 0,325 -24,295" fill="#22c55e" opacity="0.95" />
      <circle cx="0" cy="295" r="4" fill="#ffffff" />

    </g>
  </g>
</svg>